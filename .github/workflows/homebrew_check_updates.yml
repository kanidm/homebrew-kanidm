---
name: Check and update brew definitions
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kanidm-release-bump
  cancel-in-progress: false

jobs:
  check_updates:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Homebrew spec update checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-automation
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check the upstream release
        id: update
        run: |
          uv run ./homebrew_check_latest_release.py
          if ! git diff --quiet -- kanidm.rb; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create release app token
        id: release-token
        if: steps.update.outputs.changed == 'true'
        # v3: use an installation token so ordinary PR checks start without a maintainer click.
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update release PR
        id: release-pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.release-token.outputs.token }}
          branch: automation/kanidm-formula-update
          add-paths: kanidm.rb
          commit-message: Update Kanidm formula
          title: Update Kanidm formula
          body: Update the Kanidm CLI formula to the latest stable release.
      - name: Enable auto-merge
        if: steps.release-pr.outputs.pull-request-operation == 'created' || steps.release-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          PR_NUMBER: ${{ steps.release-pr.outputs.pull-request-number }}
          PR_HEAD: ${{ steps.release-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD"
