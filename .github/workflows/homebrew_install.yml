---
name: Homebrew install
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install Kanidm (Homebrew)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld
      - name: Build and test the checked-out formula
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          export HOMEBREW_NO_AUTO_UPDATE=1
          .github/scripts/test-homebrew-install.sh
